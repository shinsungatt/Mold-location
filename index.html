<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신성오토텍 금형 위치 관리 시스템</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#080c18; color:#e0e8ff; font-family:'Malgun Gothic','맑은 고딕',sans-serif; overflow:hidden; height:100vh; }

/* ── Top Bar ── */
#top-bar {
  position:fixed; top:0; left:0; right:0; height:58px;
  background:rgba(8,12,24,0.96); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(80,140,255,0.2);
  display:flex; align-items:center; padding:0 14px; gap:10px; z-index:100;
}
#logo { font-size:14px; font-weight:700; color:#5a9ef8; white-space:nowrap; }
#logo span { color:#ff8c00; }
#search-wrap { flex:1; max-width:400px; position:relative; }
#search-input {
  width:100%; padding:8px 34px 8px 13px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(80,140,255,0.28); border-radius:7px;
  color:#fff; font-size:13px; outline:none; transition:border-color .2s;
}
#search-input:focus { border-color:rgba(80,140,255,0.75); }
#search-input::placeholder { color:rgba(255,255,255,0.3); }
#search-clear {
  position:absolute; right:9px; top:50%; transform:translateY(-50%);
  color:rgba(255,255,255,0.3); cursor:pointer; font-size:15px; display:none;
}
#search-clear:hover { color:rgba(255,255,255,0.7); }
#autocomplete {
  position:absolute; top:calc(100%+2px); left:0; right:0;
  background:#0d1428; border:1px solid rgba(80,140,255,0.28);
  border-radius:0 0 7px 7px; max-height:270px; overflow-y:auto;
  z-index:300; display:none; box-shadow:0 8px 32px rgba(0,0,0,0.7);
}
.ac-item { padding:8px 13px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.04); }
.ac-item:hover { background:rgba(80,140,255,0.14); }
.ac-num { font-size:13px; font-weight:600; color:#5a9ef8; }
.ac-pn  { font-size:11px; color:#ffb040; margin-top:1px; }
.ac-sub { font-size:11px; color:rgba(255,255,255,0.36); margin-top:1px; }

/* ── 툴바 버튼 그룹 ── */
#floor-btns { display:flex; gap:5px; }
.f-btn {
  padding:6px 12px; background:rgba(255,255,255,0.05);
  border:1px solid rgba(80,140,255,0.2); border-radius:6px;
  color:#8ab4f8; cursor:pointer; font-size:12px; font-weight:600;
  transition:all .2s; white-space:nowrap;
}
.f-btn:hover { background:rgba(80,140,255,0.16); border-color:rgba(80,140,255,0.5); }
.f-btn.active { background:rgba(80,140,255,0.26); border-color:#5a9ef8; color:#fff; }
.f-btn.reset { color:#ff8c00; border-color:rgba(255,140,0,0.28); }
.f-btn.reset:hover { background:rgba(255,140,0,0.13); }

/* ── Excel 버튼 ── */
#excel-btns { display:flex; gap:5px; margin-left:auto; }
.xl-btn {
  display:flex; align-items:center; gap:5px;
  padding:6px 11px; border-radius:6px; cursor:pointer;
  font-size:12px; font-weight:600; transition:all .2s; border:1px solid;
}
.xl-upload {
  background:rgba(50,200,100,0.1); border-color:rgba(50,200,100,0.3); color:#50e896;
}
.xl-upload:hover { background:rgba(50,200,100,0.2); border-color:#50e896; }
.xl-download {
  background:rgba(80,140,255,0.1); border-color:rgba(80,140,255,0.3); color:#7eb8f7;
}
.xl-download:hover { background:rgba(80,140,255,0.2); border-color:#7eb8f7; }

/* ── Canvas ── */
#cv { position:fixed; top:58px; left:0; right:320px; bottom:0; }
#cv canvas { width:100%!important; height:100%!important; }

/* ── Right Panel ── */
#panel {
  position:fixed; top:58px; right:0; width:320px; bottom:0;
  background:rgba(8,12,24,0.97); border-left:1px solid rgba(80,140,255,0.12);
  display:flex; flex-direction:column;
}
#results-area { flex:1; overflow-y:auto; padding:10px; }
.r-header { font-size:11px; color:rgba(255,255,255,0.32); padding:6px 4px 10px; }
.r-item {
  padding:10px 11px; background:rgba(255,255,255,0.03);
  border:1px solid rgba(80,140,255,0.1); border-radius:7px;
  margin-bottom:7px; cursor:pointer; transition:all .2s;
}
.r-item:hover { background:rgba(80,140,255,0.09); border-color:rgba(80,140,255,0.36); }
.r-item.sel  { background:rgba(255,140,0,0.1);  border-color:rgba(255,140,0,0.45); }
.r-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:3px; }
.r-num { font-size:14px; font-weight:700; color:#5a9ef8; }
.r-pn  { font-size:11px; color:#ffb040; text-align:right; max-width:130px; word-break:break-all; }
.r-loc {
  display:inline-block; margin:2px 0;
  background:rgba(50,220,100,0.12); border:1px solid rgba(50,220,100,0.28);
  border-radius:4px; padding:2px 7px; font-size:11px; color:#50e896;
}
.r-loc.ext  { background:rgba(255,160,0,0.09);  border-color:rgba(255,160,0,0.28);  color:#ffb040; }
.r-loc.none { background:rgba(255,80,80,0.07);  border-color:rgba(255,80,80,0.22);  color:#ff7070; }
.r-info { font-size:11px; color:rgba(255,255,255,0.36); margin-top:2px; }

#detail {
  border-top:1px solid rgba(80,140,255,0.12); padding:13px;
  background:rgba(0,0,0,0.2); display:none;
}
.d-title { font-size:16px; font-weight:700; color:#ff8c00; margin-bottom:10px; }
.d-row {
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:12px;
}
.d-lbl { color:rgba(255,255,255,0.36); min-width:72px; }
.d-val { color:#d8e8ff; font-weight:500; text-align:right; max-width:175px; word-break:break-all; }
.d-val.ok  { color:#50e896; font-weight:700; }
.d-val.ext { color:#ffb040; }
.d-val.pn  { color:#ffb040; }
.shot-bar { width:100%; height:4px; background:rgba(255,255,255,0.07); border-radius:2px; margin-top:4px; }
.shot-fill { height:100%; border-radius:2px; }

/* ── Drop Overlay ── */
#drop {
  position:fixed; inset:0;
  background:radial-gradient(ellipse at 50% 40%, #0d1530 0%, #080c18 70%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:1000;
}
.drop-logo { font-size:26px; font-weight:700; color:#5a9ef8; margin-bottom:5px; }
.drop-logo span { color:#ff8c00; }
.drop-sub { font-size:12px; color:rgba(255,255,255,0.26); margin-bottom:44px; letter-spacing:2px; }
#drop-zone {
  width:370px; height:200px;
  border:2px dashed rgba(80,140,255,0.36); border-radius:15px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; transition:all .28s; background:rgba(80,140,255,0.04);
}
#drop-zone:hover, #drop-zone.over {
  border-color:#5a9ef8; background:rgba(80,140,255,0.1);
  box-shadow:0 0 50px rgba(80,140,255,0.16);
}
.dz-icon { font-size:48px; margin-bottom:12px; }
.dz-text { font-size:14px; color:rgba(255,255,255,0.56); }
.dz-sub  { font-size:12px; color:rgba(255,255,255,0.26); margin-top:6px; }
#file-in { display:none; }

/* ── Legend / Hint ── */
#legend {
  position:fixed; bottom:13px; left:13px;
  background:rgba(8,12,24,0.85); border:1px solid rgba(80,140,255,0.13);
  border-radius:7px; padding:9px 13px; font-size:11px; z-index:90;
}
.lg-row { display:flex; align-items:center; gap:7px; margin-bottom:4px; }
.lg-dot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }
#hint {
  position:fixed; bottom:13px; left:50%; transform:translateX(-50%);
  background:rgba(8,12,24,0.65); border-radius:5px;
  padding:4px 11px; font-size:11px; color:rgba(255,255,255,0.24); z-index:90;
  pointer-events:none; white-space:nowrap;
}
#loading {
  position:fixed; bottom:48px; left:50%; transform:translateX(-50%);
  background:rgba(8,12,24,0.92); border:1px solid rgba(80,140,255,0.26);
  border-radius:7px; padding:10px 20px; font-size:13px; color:#5a9ef8;
  display:none; z-index:500;
}

/* ── 슬롯 등록 모달 ── */
#modal-backdrop {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.55); z-index:499; display:none;
}
#slot-modal {
  position:fixed; top:50%; left:calc(50% - 160px);
  transform:translateY(-50%);
  background:#0a0f20;
  border:1px solid rgba(80,140,255,0.45);
  border-radius:11px; padding:18px 20px;
  width:300px; z-index:500; display:none;
  box-shadow:0 0 60px rgba(80,140,255,0.25);
}
.sm-title { font-size:13px; font-weight:700; color:#5a9ef8; margin-bottom:5px; }
.sm-loc   { font-size:12px; color:#50e896; margin-bottom:13px; opacity:.85; }
#slot-modal-input {
  width:100%; padding:8px 12px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(80,140,255,0.3);
  border-radius:6px; color:#fff;
  font-size:13px; outline:none; margin-bottom:8px;
  font-family:'Malgun Gothic',sans-serif;
}
#slot-modal-input:focus { border-color:rgba(80,140,255,0.7); }
#slot-modal-ac {
  background:#0d1428;
  border:1px solid rgba(80,140,255,0.2);
  border-radius:7px; max-height:170px;
  overflow-y:auto; margin-bottom:10px; display:none;
}
.sm-ac-item {
  padding:7px 11px; cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,0.04);
}
.sm-ac-item:last-child { border-bottom:none; }
.sm-ac-item:hover { background:rgba(80,140,255,0.12); }
.sm-ac-num { font-size:12px; font-weight:600; color:#5a9ef8; }
.sm-ac-sub { font-size:11px; color:rgba(255,255,255,0.36); margin-top:2px; }
.sm-btns { display:flex; gap:8px; margin-top:2px; }
.sm-btn {
  flex:1; padding:8px; border-radius:6px;
  cursor:pointer; font-size:12px; font-weight:600;
  border:1px solid; text-align:center; transition:all .2s;
  font-family:'Malgun Gothic',sans-serif;
}
.sm-btn-ok     { background:rgba(80,140,255,0.15); border-color:rgba(80,140,255,0.45); color:#7eb8f7; }
.sm-btn-ok:hover { background:rgba(80,140,255,0.3); }
.sm-btn-cancel { background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.12); color:rgba(255,255,255,0.4); }
.sm-btn-cancel:hover { background:rgba(255,255,255,0.1); }
.sm-note { font-size:10px; color:rgba(255,255,255,0.22); margin-top:10px; text-align:center; }

::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(80,140,255,0.2); border-radius:2px; }
</style>
</head>
<body>

<!-- ────── 시작 화면 ────── -->
<div id="drop">
  <div class="drop-logo">⚙ 신성오토텍 <span>금형위치</span></div>
  <div class="drop-sub">3D SMART FACTORY LOCATION SYSTEM</div>
  <div id="drop-zone">
    <div class="dz-icon">📂</div>
    <div class="dz-text">엑셀 파일을 드래그하거나 클릭하세요</div>
    <div class="dz-sub">신성오토텍 금형위치.xlsx</div>
  </div>
  <input type="file" id="file-in" accept=".xlsx,.xls">
</div>

<!-- ────── 상단 바 ────── -->
<div id="top-bar">
  <div id="logo">⚙ 신성오토텍 <span>금형위치</span></div>
  <div id="search-wrap">
    <input type="text" id="search-input" placeholder="금형번호 / P/N / 부품명 / 고객사...">
    <span id="search-clear">✕</span>
    <div id="autocomplete"></div>
  </div>
  <div id="floor-btns">
    <button class="f-btn active" id="btn1">1층</button>
    <button class="f-btn" id="btn2">2층</button>
    <button class="f-btn reset" id="btnReset">전체보기</button>
  </div>
  <div id="excel-btns">
    <div class="xl-btn xl-upload" id="btn-upload" title="엑셀 파일 업로드">
      <span>⬆</span> 업로드
    </div>
    <div class="xl-btn xl-download" id="btn-download" title="현재 데이터 다운로드">
      <span>⬇</span> 다운로드
    </div>
  </div>
</div>

<!-- ────── 3D 캔버스 ────── -->
<div id="cv"></div>

<!-- ────── 우측 패널 ────── -->
<div id="panel">
  <div id="results-area">
    <div class="r-header">금형을 검색하면 여기에 결과가 표시됩니다</div>
  </div>
  <div id="detail"></div>
</div>

<!-- ────── 범례 ────── -->
<div id="legend">
  <div class="lg-row"><div class="lg-dot" style="background:#388e3c"></div>소형 선반 랙 (A-U)</div>
  <div class="lg-row"><div class="lg-dot" style="background:#2e7d32"></div>중형 랙 (BA-BJ/중형/중파)</div>
  <div class="lg-row"><div class="lg-dot" style="background:#1565c0"></div>사출기</div>
  <div class="lg-row"><div class="lg-dot" style="background:#5a7090"></div>금형 등록됨</div>
  <div class="lg-row"><div class="lg-dot" style="background:#ff8c00"></div>검색/선택 위치</div>
</div>
<div id="hint">🖱 드래그:회전 &nbsp;|&nbsp; 스크롤:줌 &nbsp;|&nbsp; 금형 클릭:상세정보 &nbsp;|&nbsp; 빈칸 클릭:등록</div>
<div id="loading">📊 데이터 불러오는 중...</div>

<!-- ────── 숨긴 업로드 input ────── -->
<input type="file" id="upload-in" accept=".xlsx,.xls" style="display:none">

<!-- ────── 슬롯 등록 모달 ────── -->
<div id="modal-backdrop"></div>
<div id="slot-modal">
  <div class="sm-title">📍 금형 등록</div>
  <div class="sm-loc" id="sm-loc-text"></div>
  <input type="text" id="slot-modal-input" placeholder="금형번호 검색 (일부 입력 가능)...">
  <div id="slot-modal-ac"></div>
  <div class="sm-btns">
    <div class="sm-btn sm-btn-ok" id="sm-btn-ok">✔ 등록</div>
    <div class="sm-btn sm-btn-cancel" id="sm-btn-cancel">✕ 취소</div>
  </div>
  <div class="sm-note">※ 등록 후 엑셀 다운로드로 저장하세요</div>
</div>

<!-- ────── 라이브러리 ────── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
(function() {
'use strict';

// ══════════════════════════════════════════════════════════════
//  § 1. 실제 레이아웃 맵 기반 섹션 위치 정의
// ══════════════════════════════════════════════════════════════

// 각 섹션: [이름, x, z, type, rows, cols, shelves]
var SECTIONS = [
  // ── 우측 랙 블록: PQRSTU / HGFEDC (3열×4행) ──
  ['P', 40,-28,'shelf', 2,2,2], ['Q', 44,-28,'shelf', 2,2,2], ['R', 48,-28,'shelf', 2,2,2],
  ['S', 40,-24,'shelf', 2,2,2], ['T', 44,-24,'shelf', 2,2,2], ['U', 48,-24,'shelf', 2,2,2],
  ['H', 40,-20,'shelf', 2,2,2], ['G', 44,-20,'shelf', 2,2,2], ['F', 48,-20,'shelf', 2,2,2],
  ['E', 40,-16,'shelf', 2,2,2], ['D', 44,-16,'shelf', 2,2,2], ['C', 48,-16,'shelf', 2,2,2],

  // ── 우측 랙 블록: BA-BJ (5열×2행) ──
  ['BA',54,-28,'medium',2,2,2], ['BB',59,-28,'medium',2,2,2], ['BC',64,-28,'medium',2,2,2],
  ['BD',69,-28,'medium',2,2,2], ['BE',74,-28,'medium',2,2,2],
  ['BJ',54,-22,'medium',2,2,2], ['BI',59,-22,'medium',2,2,2], ['BH',64,-22,'medium',2,2,2],
  ['BG',69,-22,'medium',2,2,2], ['BF',74,-22,'medium',2,2,2],

  // ── 하단 좌측: B, A ──
  ['B',-58, 5,'shelf', 3,3,2], ['A',-52, 5,'shelf', 3,3,2],

  // ── 하단 중앙좌: K L M N J ──
  ['K',-44, 5,'shelf', 3,3,2], ['L',-39, 5,'shelf', 3,3,2],
  ['M',-34, 5,'shelf', 3,3,2], ['N',-29, 5,'shelf', 3,3,2],
  ['J',-24, 5,'shelf', 3,3,2],

  // ── 하단 중앙: O, I ──
  ['O',-10, 5,'shelf', 3,3,2], ['I', -5, 5,'shelf', 3,3,2],

  // ── 중형 랙 ──
  ['중1',-55,18,'medium',3,2,2], ['중2',-50,18,'medium',3,2,2],
  ['중3',-45,18,'medium',3,2,2], ['중4',-40,18,'medium',3,2,2],
  ['중5',-35,18,'medium',3,2,2], ['중6',-30,18,'medium',3,2,2],

  // ── 중파 랙 ──
  ['중파1',-25,18,'medium',3,2,2], ['중파2',-20,18,'medium',3,2,2],
  ['중파3',-15,18,'medium',3,2,2], ['중파4',-10,18,'medium',3,2,2],
  ['중파5', -5,18,'medium',3,2,2],
  ['중파6',-55,26,'medium',3,2,2], ['중파7',-50,26,'medium',3,2,2],
  ['중파8',-45,26,'medium',3,2,2], ['중파9',-40,26,'medium',3,2,2],
  ['중파10',-35,26,'medium',3,2,2],
];

// 슬롯 크기
var SLOT = {
  shelf:    { w:1.40, d:1.40, h:1.10 },
  medium:   { w:1.65, d:1.65, h:1.40 },
  standing: { w:2.10, d:2.60, h:2.60 },
};

// 외부 위치 키워드
var EXT_KW = ['금형창고','경기 화성','경기화성','LG평택','LG B-','MTX창고',
              '금형폐기','반납','사출현장','모베이스','금형실','하이게인','인팩'];

// ══════════════════════════════════════════════════════════════
//  § 2. 위치 코드 파서
// ══════════════════════════════════════════════════════════════
function parseLocation(raw) {
  if (!raw) return null;
  var s = String(raw).trim();
  if (!s || s === 'undefined') return null;
  for (var i = 0; i < EXT_KW.length; i++)
    if (s.indexOf(EXT_KW[i]) >= 0) return { type:'ext', raw:s };
  var m;
  m = s.match(/^(중파\d+)-(\d+)-(\d+)(?:-(\d+))?$/);
  if (m) return { type:'int', sec:m[1], r:+m[2], c:+m[3], sh:m[4]?+m[4]:1 };
  m = s.match(/^(중\d+)-(\d+)-(\d+)(?:-(\d+))?$/);
  if (m) return { type:'int', sec:m[1], r:+m[2], c:+m[3], sh:m[4]?+m[4]:1 };
  m = s.match(/^([A-Za-z]+)-(\d+)-(\d+)(?:-(\d+))?$/);
  if (m) return { type:'int', sec:m[1].toUpperCase(), r:+m[2], c:+m[3], sh:m[4]?+m[4]:1 };
  return { type:'unk', raw:s };
}

// ══════════════════════════════════════════════════════════════
//  § 3. Three.js 초기화

var cvDiv = document.getElementById('cv');
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x080c18);
scene.fog = new THREE.FogExp2(0x080c18, 0.004);

var camera = new THREE.PerspectiveCamera(50, cvDiv.clientWidth/cvDiv.clientHeight, 0.1, 700);
camera.position.set(10, 75, 80);

var renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(cvDiv.clientWidth, cvDiv.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
cvDiv.appendChild(renderer.domElement);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(5, 0, -5);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 4;
controls.maxDistance = 250;
controls.maxPolarAngle = Math.PI / 2.05;
controls.update();

// 조명
scene.add(new THREE.AmbientLight(0x223080, 0.85));
var sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(20, 60, 30);
sun.castShadow = true;
sun.shadow.mapSize.width = sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left=-100; sun.shadow.camera.right=100;
sun.shadow.camera.top=80;    sun.shadow.camera.bottom=-80;
sun.shadow.camera.far=300;
scene.add(sun);
scene.add(Object.assign(new THREE.DirectionalLight(0x1030c0, 0.28), {
  position: new THREE.Vector3(-30, 20, -20)
}));

window.addEventListener('resize', function() {
  camera.aspect = cvDiv.clientWidth / cvDiv.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(cvDiv.clientWidth, cvDiv.clientHeight);
});

// ══════════════════════════════════════════════════════════════
//  § 4. 재료 헬퍼
// ══════════════════════════════════════════════════════════════
function mat(hex, rough, met) {
  return new THREE.MeshStandardMaterial({
    color: hex,
    roughness: rough !== undefined ? rough : 0.6,
    metalness: met  !== undefined ? met   : 0.1
  });
}
var MAT_FLOOR  = mat(0x10162a, .88, .05);
var MAT_WALL   = mat(0x0b0f1c, .9);
var MAT_BEAM   = mat(0x1c2540, .9);
var MAT_SAFETY = new THREE.MeshStandardMaterial({color:0xffd600, emissive:0x664400, emissiveIntensity:.4});
var MAT_MOLD   = mat(0x6c7585, .28, .78);
var MAT_EJEC   = mat(0x384050, .5, .9);
var MAT_CTRL   = mat(0x18222e, .8);
var MAT_OFFICE = mat(0x1e2a3a, .8);
var MAT_YELLOW = mat(0x3a2e00, .9);
var MAT_GREEN2 = mat(0x0f2010, .9);

// ══════════════════════════════════════════════════════════════
//  § 5. 지오메트리 헬퍼
// ══════════════════════════════════════════════════════════════
function addBox(x,y,z, w,h,d, material, shadow) {
  var mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  mesh.position.set(x,y,z);
  if (shadow !== false) { mesh.castShadow = true; mesh.receiveShadow = true; }
  scene.add(mesh); return mesh;
}

function makeSprite(text, color, size) {
  var c = document.createElement('canvas');
  c.width=192; c.height=64;
  var ctx = c.getContext('2d');
  ctx.font = 'bold '+(size||18)+'px Malgun Gothic,Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = color||'#7eb8f7';
  ctx.shadowColor='rgba(0,0,0,0.95)'; ctx.shadowBlur=8;
  ctx.fillText(text,96,32);
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent:true, depthTest:false
  }));
  return sp;
}

function addLabel(text, x, y, z, color, scaleX, scaleY) {
  var sp = makeSprite(text, color, 18);
  sp.position.set(x,y,z);
  sp.scale.set(scaleX||3.5, scaleY||1.4, 1);
  scene.add(sp); return sp;
}

// 슬롯 네임택 스프라이트 생성
function makeSlotTag(text) {
  var c = document.createElement('canvas');
  c.width = 128; c.height = 36;
  var ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 128, 36);
  if (text) {
    ctx.font = 'bold 10px Malgun Gothic,Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#7eb8f7';
    ctx.shadowColor = 'rgba(0,0,0,0.95)'; ctx.shadowBlur = 5;
    var display = text.length > 16 ? text.slice(0,16)+'…' : text;
    ctx.fillText(display, 64, 18);
  } else {
    ctx.font = '9px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(90,140,220,0.22)';
    ctx.fillText('+ 등록', 64, 18);
  }
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent:true, depthTest:false
  }));
  return sp;
}

function buildFactory() {
  var fl = new THREE.Mesh(new THREE.PlaneGeometry(170,105), MAT_FLOOR);
  fl.rotation.x = -Math.PI/2; fl.receiveShadow = true; scene.add(fl);
  scene.add(new THREE.GridHelper(170, 85, 0x131a2e, 0x0d1220));

  addBox( 0, 5,-52, 170,12,.6, MAT_WALL, false);
  addBox( 0, 5, 53, 170,12,.6, MAT_WALL, false);
  addBox(-83,5,  0, .6,12,105, MAT_WALL, false);
  addBox( 83,5,  0, .6,12,105, MAT_WALL, false);

  for (var z=-45; z<=48; z+=20) addBox(0, 9.5, z, 170,.4,.4, MAT_BEAM, false);
  for (var x=-80; x<=80; x+=20) addBox(x, 9.5, 0, .4,.4,105, MAT_BEAM, false);

  addBox(0, .015, -2, 120,.02,.15, MAT_SAFETY, false);
  addBox(0, .015,  2,  38,.02,.15, MAT_SAFETY, false);
  for (var ax=-58; ax<=38; ax+=9)
    addBox(ax, .015, 16, .1,.02,50, MAT_SAFETY, false);

  buildZoneAreas();
  buildMachines();
  buildAllRacks();
}

function drawMachine(cx, cz, w, d, h, num, ton, color) {
  var bm = mat(color,.5,.4);
  var am = mat(0x1565c0,.38,.58);

  addBox(cx, h+.35, cz,      w*.5,.7,  d*.5,am);
  addBox(cx, h*.42, cz-d*.4, .28, h*.55,d*.2,MAT_CTRL);
  addBox(cx+w*.35,h*.5,cz-d*.32,.16,h*.42,d*.2,MAT_CTRL);
  var el = mat(0x00e5ff,.3,.1);
  var cy = new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.4,8), el);
  cy.position.set(cx, h+.8, cz); cy.castShadow=true; scene.add(cy);
  var tonStr = ton > 0 ? num+'호기\n'+ton+'T' : num+'호기';
  var lbl = makeSprite(tonStr.replace('\n',' '), h>5?'#42a5f5':'#5ba8d8', 13);
  lbl.position.set(cx, h+1.7, cz);
  lbl.scale.set(h>4?5.5:4, 1.5, 1); scene.add(lbl);
}

// ══════════════════════════════════════════════════════════════
//  § 9. 랙 전체 구축
// ══════════════════════════════════════════════════════════════
var slotReg      = {};   // locationKey → entry
var allSlots     = [];   // 모든 슬롯 entry 배열
var allSlotMeshes= [];   // 레이캐스팅용 메시 배열
var meshToSlot   = {};   // mesh.uuid → entry

function buildAllRacks() {
  SECTIONS.forEach(function(def) {
    buildSection(def[0], def[1], def[2], def[3], def[4], def[5], def[6]);
  });
}

function buildSection(name, sx, sz, type, rows, cols, shelves) {
  var sl = SLOT[type];
  var tw = cols*sl.w + (cols-1)*.07;
  var td = rows*sl.d + (rows-1)*.07;
  var th = shelves*sl.h + .28;

  var gcol = (type==='standing') ? 0x1b5e20 : (type==='medium') ? 0x2e7d32 : 0x388e3c;
  var gm   = mat(gcol, .6, .22);
  var ph   = th + .12;
  var PR   = .06;

  // 코너 포스트
  [[0,0],[tw,0],[0,td],[tw,td]].forEach(function(d) {
    addBox(sx+d[0], ph/2, sz+d[1], PR*2, ph, PR*2, gm);
  });

  // 수평 빔 & 선반
  var BT = .065;
  for (var s=0; s<=shelves; s++) {
    var by = s*sl.h + .045;
    addBox(sx+tw/2, by, sz,     tw, BT, BT, gm, false);
    addBox(sx+tw/2, by, sz+td,  tw, BT, BT, gm, false);
    addBox(sx,      by, sz+td/2,BT, BT, td, gm, false);
    addBox(sx+tw,   by, sz+td/2,BT, BT, td, gm, false);
    if (s < shelves) {
      addBox(sx+tw/2, by+.042, sz+td/2,
             tw-.02, .042, td-.02, mat(gcol-.08,.75,.05), false);
    }
  }

  // 섹션 레이블
  var lc = (type==='medium') ? '#81c784' : '#aed6f1';
  var lbl = makeSprite(name, lc, 17);
  lbl.position.set(sx+tw/2, th+.9, sz+td/2);
  lbl.scale.set(2.8, 1.2, 1); scene.add(lbl);

  // 금형 슬롯 메쉬 + 네임택 생성
  for (var r=0; r<rows; r++) {
    for (var c=0; c<cols; c++) {
      for (var sh=0; sh<shelves; sh++) {
        var mx = sx + c*(sl.w+.07) + sl.w/2;
        var mz = sz + r*(sl.d+.07) + sl.d/2;
        var my = sh*sl.h + sl.h/2 + .10;
        var mw, mh, md;
        if (type==='standing') { mw=sl.w*.56; mh=sl.h*.86; md=sl.d*.5; }
        else                   { mw=sl.w*.70; mh=sl.h*.60; md=sl.d*.70; }

        var moldMesh = new THREE.Mesh(
          new THREE.BoxGeometry(mw, mh, md), MAT_MOLD.clone()
        );
        moldMesh.position.set(mx, my, mz);
        moldMesh.castShadow = true; moldMesh.receiveShadow = true;
        scene.add(moldMesh);

        // 이젝터 핀
        var ej = new THREE.Mesh(
          new THREE.CylinderGeometry(mw*.09, mw*.09, .035, 8), MAT_EJEC
        );
        ej.rotation.x = Math.PI/2;
        ej.position.set(mx, my+mh*.12, mz-md/2-.004);
        scene.add(ej);

        // 네임택 스프라이트
        var tag = makeSlotTag('');
        tag.position.set(mx, my + mh/2 + 0.25, mz);
        tag.scale.set(sl.w * 0.90, sl.h * 0.20, 1);
        scene.add(tag);

        // 슬롯 엔트리 등록
        var wp = new THREE.Vector3(mx, my, mz);
        var k4 = name+'-'+(r+1)+'-'+(c+1)+'-'+(sh+1);
        var k3 = name+'-'+(r+1)+'-'+(c+1);
        var entry = {
          mesh:      moldMesh,
          worldPos:  wp,
          sprite:    tag,
          moldData:  null,
          locKey:    k4,
          baseColor: 0x6c7585
        };
        slotReg[k4] = entry;
        if (!slotReg[k3]) slotReg[k3] = entry;
        allSlots.push(entry);
        allSlotMeshes.push(moldMesh);
        meshToSlot[moldMesh.uuid] = entry;
      }
    }
  }
}

var f2g = new THREE.Group();
scene.add(f2g); f2g.visible = false;

function build2F() {
  if (f2built) return; f2built = true;
  var yOff = 6.5;
  var pf = new THREE.Mesh(new THREE.PlaneGeometry(90,55), mat(0x0e1620,.85));
  pf.rotation.x=-Math.PI/2; pf.position.set(-5,yOff,-5); pf.receiveShadow=true; f2g.add(pf);
  var rm = mat(0x8090b0,.6,.5);
  [[-5,yOff+.5,-32.5,90,.1,.1],[-5,yOff+.5,22.5,90,.1,.1],
   [-50,yOff+.5,-5,.1,.1,55],[40,yOff+.5,-5,.1,.1,55]].forEach(function(d){
    var mm=new THREE.Mesh(new THREE.BoxGeometry(d[3],d[4],d[5]),rm);
    mm.position.set(d[0],d[1],d[2]); f2g.add(mm);
  });
  for (var s=0; s<7; s++) {
    var sm=new THREE.Mesh(new THREE.BoxGeometry(3,.38,1.1),mat(0x252f40,.7));
    sm.position.set(42, .18+s*.88, -25+s*1.6); f2g.add(sm);
  }
  var mm2 = mat(0x7a8898,.28,.75);
  for (var i=0; i<16; i++) {
    var bx=new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 3.2+Math.random()*.9, 2.2+Math.random()*.5),
      mm2.clone()
    );
    bx.position.set(-44+i*5.5, yOff+2.1, -15+Math.random()*5);
    bx.castShadow=true; f2g.add(bx);
  }
}

// ══════════════════════════════════════════════════════════════
//  § 11. 하이라이트
// ══════════════════════════════════════════════════════════════
var HL = { mesh:null, light:null, aura:null };

function clearHL() {
  if (HL.mesh) {
    var hlEntry = meshToSlot[HL.mesh.uuid];
    var baseColor = (hlEntry && hlEntry.baseColor !== undefined) ? hlEntry.baseColor : 0x6c7585;
    HL.mesh.material.color.set(baseColor);
    HL.mesh.material.emissive.set(0x000000);
    HL.mesh.material.emissiveIntensity = 0;
    HL.mesh = null;
  }
  if (HL.light) { scene.remove(HL.light); HL.light = null; }
  if (HL.aura)  { scene.remove(HL.aura);  HL.aura  = null; }
}

function doHighlight(entry) {
  clearHL();
  var pos = entry.worldPos;
  HL.mesh = entry.mesh;
  HL.mesh.material.color.set(0xff6600);
  HL.mesh.material.emissive.set(0xff3300);
  HL.mesh.material.emissiveIntensity = .8;

  HL.light = new THREE.PointLight(0xff6600, 7, 13);
  HL.light.position.copy(pos).add(new THREE.Vector3(0,1.3,0));
  scene.add(HL.light);

  HL.aura = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 12, 8),
    new THREE.MeshStandardMaterial({
      color:0xff4400, transparent:true, opacity:.14,
      emissive:0xff3300, emissiveIntensity:.5
    })
  );
  HL.aura.position.copy(pos); scene.add(HL.aura);
}

// 슬롯 네임택 텍스트 갱신
function updateSlotSprite(entry, text) {
  if (!entry.sprite) return;
  var c = document.createElement('canvas');
  c.width = 128; c.height = 36;
  var ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 128, 36);
  if (text) {
    ctx.font = 'bold 10px Malgun Gothic,Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#7eb8f7';
    ctx.shadowColor = 'rgba(0,0,0,0.95)'; ctx.shadowBlur = 5;
    var display = text.length > 16 ? text.slice(0,16)+'…' : text;
    ctx.fillText(display, 64, 18);
  } else {
    ctx.font = '9px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(90,140,220,0.22)';
    ctx.fillText('+ 등록', 64, 18);
  }
  var oldMap = entry.sprite.material.map;
  entry.sprite.material.map = new THREE.CanvasTexture(c);
  entry.sprite.material.needsUpdate = true;
  if (oldMap) oldMap.dispose();
}

// 엑셀 데이터 → 슬롯 매핑
function assignMoldsToSlots() {
  // 전체 초기화
  allSlots.forEach(function(entry) {
    entry.moldData  = null;
    entry.baseColor = 0x6c7585;
    entry.mesh.material.color.set(0x6c7585);
    updateSlotSprite(entry, '');
  });
  // 금형 데이터 → 슬롯 할당
  moldData.forEach(function(mold) {
    if (!mold.parsed || mold.parsed.type !== 'int') return;
    var p = mold.parsed;
    var k4 = p.sec+'-'+p.r+'-'+p.c+'-'+p.sh;
    var k3 = p.sec+'-'+p.r+'-'+p.c;
    var entry = slotReg[k4] || slotReg[k3];
    if (entry && !entry.moldData) {
      entry.moldData  = mold;
      entry.baseColor = 0x5a7090; // 점유 슬롯 색상
      entry.mesh.material.color.set(0x5a7090);
      updateSlotSprite(entry, mold.moldNum);
    }
  });
}

// 3D 슬롯 클릭 처리
function onSlotClick(entry) {
  if (entry.moldData) {
    // 점유 슬롯 → 상세정보 표시
    var m = entry.moldData;
    var badge;
    if (!m.location || m.location==='undefined')
      badge='<span class="r-loc none">위치 미등록</span>';
    else if (m.parsed && m.parsed.type==='int')
      badge='<span class="r-loc">'+esc(m.location)+'</span>';
    else
      badge='<span class="r-loc ext">'+esc(m.location)+'</span>';
    var pnHtml = m.custPN ? '<div class="r-pn">P/N: '+esc(m.custPN)+'</div>' : '';
    document.getElementById('results-area').innerHTML =
      '<div class="r-header">3D 클릭 선택</div>'
      + '<div class="r-item sel">'
      + '<div class="r-top"><div class="r-num">'+esc(m.moldNum)+'</div>'+pnHtml+'</div>'
      + badge
      + '<div class="r-info">'+esc(m.partName||'-')+' · '+esc(m.customer||'-')+'</div>'
      + '</div>';
    curResults = [m]; selIdx = 0;
    showDetail(m);
    doHighlight(entry);
    flyTo(entry.worldPos);
  } else {
    // 빈 슬롯 → 등록 모달
    showInputModal(entry);
  }
}

// 빈 슬롯 등록 모달
var currentModalSlot = null;
var currentModalMold = null;

function showInputModal(entry) {
  currentModalSlot = entry;
  currentModalMold = null;
  document.getElementById('sm-loc-text').textContent = '슬롯 위치: ' + entry.locKey;
  document.getElementById('slot-modal-input').value = '';
  var ac = document.getElementById('slot-modal-ac');
  ac.style.display = 'none'; ac.innerHTML = '';
  document.getElementById('modal-backdrop').style.display = 'block';
  document.getElementById('slot-modal').style.display = 'block';
  setTimeout(function() { document.getElementById('slot-modal-input').focus(); }, 60);
}

function closeInputModal() {
  document.getElementById('modal-backdrop').style.display = 'none';
  document.getElementById('slot-modal').style.display = 'none';
  currentModalSlot = null;
  currentModalMold = null;
}

function assignMoldToSlot(slot, mold) {
  mold.location = slot.locKey;
  mold.parsed   = parseLocation(slot.locKey);
  // 전체 재매핑 (중복 방지)
  assignMoldsToSlots();
  showDetail(mold);
  doHighlight(slot);
  flyTo(slot.worldPos);
  closeInputModal();
}

// 레이캐스터 & 마우스
var raycaster    = new THREE.Raycaster();
var mouseDownPos = { x:0, y:0 };
var lastHoverTime = 0;

function onCanvasClick(e) {
  var rect = renderer.domElement.getBoundingClientRect();
  var mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width)  * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(mouse, camera);
  var hits = raycaster.intersectObjects(allSlotMeshes);
  if (hits.length > 0) {
    var entry = meshToSlot[hits[0].object.uuid];
    if (entry) onSlotClick(entry);
  }
}

// ══════════════════════════════════════════════════════════════
//  § 12. 카메라 애니메이션
// ══════════════════════════════════════════════════════════════
var DEF_CAM = { x:10, y:75, z:80 };
var DEF_TGT = { x: 5, y: 0, z:-5 };

function flyTo(pos) {
  gsap.to(controls.target, { x:pos.x, y:pos.y, z:pos.z, duration:1.3, ease:'power3.inOut' });
  gsap.to(camera.position, {
    x:pos.x+5, y:pos.y+9, z:pos.z+13,
    duration:1.3, ease:'power3.inOut'
  });
}

function resetCam() {
  gsap.to(camera.position, { x:DEF_CAM.x,y:DEF_CAM.y,z:DEF_CAM.z, duration:1.2, ease:'power2.inOut' });
  gsap.to(controls.target, { x:DEF_TGT.x,y:DEF_TGT.y,z:DEF_TGT.z, duration:1.2, ease:'power2.inOut' });
  clearHL(); deselectAll();
}

function switchFloor(f) {
  document.getElementById('btn1').classList.toggle('active', f===1);
  document.getElementById('btn2').classList.toggle('active', f===2);
  if (f===2) {
    build2F(); f2g.visible=true;
    gsap.to(camera.position,{x:0,y:50,z:40,duration:1.1,ease:'power2.inOut'});
    gsap.to(controls.target,{x:0,y:7,z:-5,duration:1.1,ease:'power2.inOut'});
  } else {
    f2g.visible=false; resetCam();
  }
}

// ══════════════════════════════════════════════════════════════
//  § 13. 데이터
// ══════════════════════════════════════════════════════════════
var moldData   = [];
var curResults = [];
var selIdx     = -1;

function loadExcel(file) {
  document.getElementById('loading').style.display='block';
  var rd = new FileReader();
  rd.onload = function(e) {
    try {
      var wb   = XLSX.read(e.target.result, { type:'binary' });
      var ws   = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws);
      moldData = rows.map(function(row) {
        return {
          moldNum:   String(row['금형번호']     || ''),
          location:  String(row['금형위치']     || ''),
          parsed:    parseLocation(row['금형위치']),
          customer:  String(row['고객사명']     || ''),
          partName:  String(row['부품명']       || ''),
          partCode:  String(row['부품코드']     || ''),
          custPN:    String(row['고객사 P/N']   || ''),
          model:     String(row['품종(MODEL)']  || ''),
          grade:     String(row['금형등급']     || ''),
          category:  String(row['금형구분']     || ''),
          totalShot: Number(row['금형보증SHOT수'] || 0),
          usedShot:  Number(row['금형사용SHOT수'] || 0),
        };
      });
      document.getElementById('loading').style.display='none';
      document.getElementById('drop').style.display='none';
      document.getElementById('results-area').innerHTML=
        '<div class="r-header">총 '+moldData.length+'개 금형 로드됨 — 검색어를 입력하세요</div>';
      // 슬롯 네임택 매핑
      assignMoldsToSlots();
    } catch(err) {
      alert('파일 읽기 오류: '+err.message);
      document.getElementById('loading').style.display='none';
    }
  };
  rd.readAsBinaryString(file);
}

// ══════════════════════════════════════════════════════════════
//  § 14. 검색 & 결과
// ══════════════════════════════════════════════════════════════
function filterMolds(q) {
  if (!q) return [];
  var lq = q.toLowerCase();
  return moldData.filter(function(m) {
    return m.moldNum.toLowerCase().indexOf(lq)  >= 0 ||
           m.partName.toLowerCase().indexOf(lq) >= 0 ||
           m.customer.toLowerCase().indexOf(lq) >= 0 ||
           m.custPN.toLowerCase().indexOf(lq)   >= 0 ||
           m.model.toLowerCase().indexOf(lq)    >= 0 ||
           m.location.toLowerCase().indexOf(lq) >= 0;
  });
}

function doSearch(q) {
  if (!q || !q.trim()) { clearResults(); return; }
  curResults = filterMolds(q.trim());
  renderResults(curResults);
  if (curResults.length > 0) pickResult(0);
}

function renderResults(arr) {
  var ra = document.getElementById('results-area');
  if (!arr.length) { ra.innerHTML='<div class="r-header">검색 결과 없음</div>'; return; }
  var html = '<div class="r-header">'+arr.length+'개 금형 검색됨</div>';
  arr.slice(0,40).forEach(function(m,i) {
    var badge;
    var loc = m.location;
    if (!loc || loc==='undefined')             badge='<span class="r-loc none">위치 미등록</span>';
    else if (m.parsed && m.parsed.type==='int') badge='<span class="r-loc">'+esc(loc)+'</span>';
    else                                        badge='<span class="r-loc ext">'+esc(loc)+'</span>';
    var pnHtml = m.custPN ? '<div class="r-pn">P/N: '+esc(m.custPN)+'</div>' : '';
    html += '<div class="r-item" data-i="'+i+'">'
          + '<div class="r-top">'
          + '<div class="r-num">'+esc(m.moldNum)+'</div>'
          + pnHtml
          + '</div>'
          + badge
          + '<div class="r-info">'+esc(m.partName||'-')+' · '+esc(m.customer||'-')+'</div>'
          + '</div>';
  });
  ra.innerHTML = html;
}

function deselectAll() {
  document.querySelectorAll('.r-item.sel').forEach(function(el){ el.classList.remove('sel'); });
}

function pickResult(i) {
  selIdx = i; deselectAll();
  var el = document.querySelector('.r-item[data-i="'+i+'"]');
  if (el) { el.classList.add('sel'); el.scrollIntoView({block:'nearest'}); }
  var m = curResults[i]; if (!m) return;
  showDetail(m); navigateTo(m);
}

function showDetail(m) {
  var dv = document.getElementById('detail');
  var sp = m.totalShot>0 ? Math.min(100,Math.round(m.usedShot/m.totalShot*100)) : 0;
  var sc = sp>80?'#ff4444':sp>60?'#ffaa00':'#50e896';
  var locCls = (!m.location)?'':((m.parsed&&m.parsed.type==='int')?' ok':' ext');
  dv.style.display='block';
  dv.innerHTML =
    '<div class="d-title">⚙ '+esc(m.moldNum)+'</div>'
   +'<div class="d-row"><span class="d-lbl">위치</span><span class="d-val'+locCls+'">'+esc(m.location||'미등록')+'</span></div>'
   +(m.custPN?'<div class="d-row"><span class="d-lbl">고객사 P/N</span><span class="d-val pn">'+esc(m.custPN)+'</span></div>':'')
   +'<div class="d-row"><span class="d-lbl">부품명</span><span class="d-val">'+esc(m.partName||'-')+'</span></div>'
   +'<div class="d-row"><span class="d-lbl">고객사</span><span class="d-val">'+esc(m.customer||'-')+'</span></div>'
   +'<div class="d-row"><span class="d-lbl">모델</span><span class="d-val">'+esc(m.model||'-')+'</span></div>'
   +'<div class="d-row"><span class="d-lbl">구분</span><span class="d-val">'+esc(m.category||'-')+'</span></div>'
   +'<div class="d-row"><span class="d-lbl">등급</span><span class="d-val">'+esc(m.grade||'-')+'</span></div>'
   +'<div class="d-row"><span class="d-lbl">SHOT 사용률</span>'
   +'<span class="d-val" style="color:'+sc+'">'+sp+'%'
   +'<div class="shot-bar"><div class="shot-fill" style="width:'+sp+'%;background:'+sc+'"></div></div>'
   +'</span></div>';
}

function navigateTo(m) {
  clearHL();
  var p = m.parsed; if (!p || p.type!=='int') return;
  var k4=p.sec+'-'+p.r+'-'+p.c+'-'+p.sh;
  var k3=p.sec+'-'+p.r+'-'+p.c;
  var entry=slotReg[k4]||slotReg[k3];
  if (!entry) return;
  doHighlight(entry); flyTo(entry.worldPos);
}

function clearResults() {
  curResults=[]; selIdx=-1;
  document.getElementById('results-area').innerHTML='<div class="r-header">검색 결과가 여기에 표시됩니다</div>';
  document.getElementById('detail').style.display='none';
  clearHL();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════════════════════
//  § 15. Excel 다운로드
// ══════════════════════════════════════════════════════════════
function downloadExcel() {
  if (!moldData.length) { alert('먼저 엑셀 파일을 업로드하세요.'); return; }
  var wsData = [
    ['금형번호','금형위치','고객사명','고객사 P/N','부품명','품종(MODEL)','금형구분','금형등급','금형보증SHOT수','금형사용SHOT수']
  ];
  moldData.forEach(function(m) {
    wsData.push([m.moldNum, m.location, m.customer, m.custPN, m.partName,
                 m.model, m.category, m.grade, m.totalShot, m.usedShot]);
  });
  var wb = XLSX.utils.book_new();
  var ws = XLSX.utils.aoa_to_sheet(wsData);
  XLSX.utils.book_append_sheet(wb, ws, 'grdList');
  XLSX.writeFile(wb, '신성오토텍_금형위치_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

// ══════════════════════════════════════════════════════════════
//  § 16. UI 이벤트 바인딩
// ══════════════════════════════════════════════════════════════
var searchInput  = document.getElementById('search-input');
var searchClear  = document.getElementById('search-clear');
var autoComplete = document.getElementById('autocomplete');

searchInput.addEventListener('input', function() {
  var q = searchInput.value.trim();
  searchClear.style.display = q ? 'block' : 'none';
  if (!q) { autoComplete.style.display='none'; clearResults(); return; }
  var hits = filterMolds(q).slice(0, 8);
  if (!hits.length) { autoComplete.style.display='none'; return; }
  autoComplete.innerHTML = hits.map(function(m) {
    var pnHtml = m.custPN ? '<div class="ac-pn">P/N: '+esc(m.custPN)+'</div>' : '';
    return '<div class="ac-item" data-num="'+esc(m.moldNum)+'">'
         + '<div class="ac-num">'+esc(m.moldNum)+'</div>'
         + pnHtml
         + '<div class="ac-sub">'+esc(m.partName||'-')+' · '+esc(m.location||'위치미상')+'</div>'
         + '</div>';
  }).join('');
  autoComplete.style.display='block';
});

autoComplete.addEventListener('click', function(e) {
  var item = e.target.closest('.ac-item'); if (!item) return;
  var num = item.dataset.num;
  searchInput.value=num; searchClear.style.display='block';
  autoComplete.style.display='none'; doSearch(num);
});

searchInput.addEventListener('keydown', function(e) {
  if (e.key==='Enter')  { autoComplete.style.display='none'; doSearch(searchInput.value); }
  if (e.key==='Escape') {
    searchInput.value=''; searchClear.style.display='none';
    autoComplete.style.display='none'; clearResults();
  }
});
searchClear.addEventListener('click', function() {
  searchInput.value=''; searchClear.style.display='none';
  autoComplete.style.display='none'; clearResults();
});
document.addEventListener('click', function(e) {
  if (!e.target.closest('#search-wrap')) autoComplete.style.display='none';
});

// 결과 클릭 (이벤트 위임)
document.getElementById('results-area').addEventListener('click', function(e) {
  var item = e.target.closest('.r-item'); if (!item) return;
  pickResult(+item.dataset.i);
});

// 층 버튼
document.getElementById('btn1').addEventListener('click', function()    { switchFloor(1); });
document.getElementById('btn2').addEventListener('click', function()    { switchFloor(2); });
document.getElementById('btnReset').addEventListener('click', function(){ resetCam(); });

// Excel 버튼
document.getElementById('btn-upload').addEventListener('click', function() {
  document.getElementById('upload-in').click();
});
document.getElementById('btn-download').addEventListener('click', downloadExcel);
document.getElementById('upload-in').addEventListener('change', function(e) {
  var f = e.target.files[0]; if (f) loadExcel(f); e.target.value='';
});

// 파일 드롭 (시작 화면)
var dropZone = document.getElementById('drop-zone');
var fileIn   = document.getElementById('file-in');
dropZone.addEventListener('click', function()  { fileIn.click(); });
dropZone.addEventListener('dragover',  function(e){ e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('over'); });
dropZone.addEventListener('drop', function(e) {
  e.preventDefault(); dropZone.classList.remove('over');
  var f = e.dataTransfer.files[0]; if (f) loadExcel(f);
});
fileIn.addEventListener('change', function(e) {
  var f = e.target.files[0]; if (f) loadExcel(f);
});

// ── 3D 캔버스 마우스 이벤트 ──
renderer.domElement.addEventListener('mousedown', function(e) {
  mouseDownPos.x = e.clientX; mouseDownPos.y = e.clientY;
});

renderer.domElement.addEventListener('click', function(e) {
  // 드래그(회전) 시 클릭 무시
  var dx = e.clientX - mouseDownPos.x;
  var dy = e.clientY - mouseDownPos.y;
  if (dx*dx + dy*dy > 25) return;
  // 모달 열려있으면 닫기
  if (document.getElementById('slot-modal').style.display === 'block') {
    closeInputModal(); return;
  }
  onCanvasClick(e);
});

renderer.domElement.addEventListener('mousemove', function(e) {
  if (e.buttons > 0 || !allSlotMeshes.length) return;
  var now = Date.now();
  if (now - lastHoverTime < 40) return; // ~25fps 제한
  lastHoverTime = now;
  var rect = renderer.domElement.getBoundingClientRect();
  var mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width)  * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(mouse, camera);
  var hits = raycaster.intersectObjects(allSlotMeshes);
  renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'default';
});

// ── 슬롯 모달 이벤트 ──
document.getElementById('modal-backdrop').addEventListener('click', closeInputModal);

var smInput = document.getElementById('slot-modal-input');
var smAc    = document.getElementById('slot-modal-ac');

smInput.addEventListener('input', function() {
  var q = this.value.trim();
  currentModalMold = null;
  if (!q || !moldData.length) { smAc.style.display='none'; return; }
  // 미배정 금형 우선 → 전체 fallback
  var hits = filterMolds(q).filter(function(m) {
    return !m.parsed || m.parsed.type !== 'int';
  }).slice(0, 6);
  if (!hits.length) hits = filterMolds(q).slice(0, 6);
  if (!hits.length) { smAc.style.display='none'; return; }
  smAc._hits = hits;
  smAc.innerHTML = hits.map(function(m, i) {
    return '<div class="sm-ac-item" data-i="'+i+'">'
         + '<div class="sm-ac-num">'+esc(m.moldNum)+'</div>'
         + '<div class="sm-ac-sub">'+esc(m.partName||'-')+' · '+esc(m.customer||'-')+'</div>'
         + '</div>';
  }).join('');
  smAc.style.display = 'block';
});

smInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('sm-btn-ok').click(); }
  if (e.key === 'Escape') closeInputModal();
});

smAc.addEventListener('click', function(e) {
  var item = e.target.closest('.sm-ac-item'); if (!item) return;
  var mold = this._hits[+item.dataset.i];
  if (mold) {
    currentModalMold = mold;
    smInput.value = mold.moldNum;
    smAc.style.display = 'none';
  }
});

document.getElementById('sm-btn-ok').addEventListener('click', function() {
  var mold = currentModalMold;
  if (!mold) {
    var q = smInput.value.trim();
    var found = moldData.filter(function(m) { return m.moldNum === q; });
    if (found.length) mold = found[0];
  }
  if (!mold || !currentModalSlot) {
    alert('금형번호를 선택하거나 정확히 입력하세요.');
    return;
  }
  assignMoldToSlot(currentModalSlot, mold);
});

document.getElementById('sm-btn-cancel').addEventListener('click', closeInputModal);

// ══════════════════════════════════════════════════════════════
//  § 17. 렌더 루프
// ══════════════════════════════════════════════════════════════
var clock = new THREE.Clock();
(function tick() {
  requestAnimationFrame(tick);
  var t = clock.getElapsedTime();
  if (HL.light) HL.light.intensity = 5 + Math.sin(t*5)*3;
  if (HL.aura)  { HL.aura.material.opacity=.12+Math.sin(t*4)*.07; HL.aura.scale.setScalar(1+Math.sin(t*3)*.1); }
  if (HL.mesh)  HL.mesh.material.emissiveIntensity = .6+Math.sin(t*5)*.3;
  controls.update();
  renderer.render(scene, camera);
})();

// ══════════════════════════════════════════════════════════════
//  § 18. 씬 구축
// ══════════════════════════════════════════════════════════════
buildFactory();

})();
</script>
