<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신성오토텍 금형 INDEX</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #0d1b2e;
  color: #e8f0ff;
  font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* 배경 격자 효과 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(90,158,248,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(90,158,248,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.login-card {
  background: rgba(18, 36, 68, 0.92);
  border: 1px solid rgba(100,160,255,0.25);
  border-radius: 16px;
  padding: 52px 48px 44px;
  width: 360px;
  box-shadow:
    0 0 60px rgba(90,158,248,0.08),
    0 20px 60px rgba(0,0,0,0.5);
  position: relative;
  backdrop-filter: blur(12px);
}

/* 상단 글로우 라인 */
.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(90,158,248,0.6), transparent);
}

.login-icon {
  text-align: center;
  margin-bottom: 20px;
}

.login-icon svg {
  width: 48px;
  height: 48px;
  opacity: 0.8;
}

.login-title {
  text-align: center;
  margin-bottom: 6px;
}

.login-title h1 {
  font-size: 20px;
  font-weight: 700;
  color: #e8f0ff;
  letter-spacing: -0.3px;
}

.login-title h1 span {
  color: #5a9ef8;
}

.login-subtitle {
  text-align: center;
  font-size: 12px;
  color: rgba(180,200,240,0.5);
  margin-bottom: 36px;
  letter-spacing: 0.3px;
}

.input-wrap {
  position: relative;
  margin-bottom: 16px;
}

.input-wrap input {
  width: 100%;
  padding: 14px 48px 14px 16px;
  background: rgba(10, 22, 48, 0.7);
  border: 1px solid rgba(100,160,255,0.2);
  border-radius: 8px;
  color: #e8f0ff;
  font-size: 20px;
  font-family: inherit;
  letter-spacing: 6px;
  text-align: center;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}

.input-wrap input::placeholder {
  letter-spacing: 0;
  font-size: 13px;
  color: rgba(150,180,230,0.4);
}

.input-wrap input:focus {
  border-color: rgba(90,158,248,0.5);
  box-shadow: 0 0 0 3px rgba(90,158,248,0.08);
}

.eye-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: rgba(150,180,230,0.5);
  padding: 4px;
  transition: color 0.2s;
  line-height: 0;
}

.eye-btn:hover {
  color: rgba(150,180,230,0.9);
}

.login-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #3d7bd4, #2a5fa8);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 15px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  letter-spacing: 0.5px;
  margin-top: 4px;
}

.login-btn:hover:not(:disabled) {
  opacity: 0.92;
}

.login-btn:active:not(:disabled) {
  transform: scale(0.99);
}

.login-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.err-msg {
  margin-top: 12px;
  text-align: center;
  font-size: 13px;
  color: #ff7070;
  min-height: 18px;
  opacity: 0;
  transition: opacity 0.2s;
}

.err-msg.show {
  opacity: 1;
}

.login-footer {
  margin-top: 28px;
  text-align: center;
  font-size: 11px;
  color: rgba(150,180,230,0.3);
  letter-spacing: 0.3px;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-icon">
    <!-- 금형/큐브 아이콘 -->
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 4L42 14V34L24 44L6 34V14L24 4Z" stroke="#5a9ef8" stroke-width="2" stroke-linejoin="round"/>
      <path d="M24 4L24 44" stroke="#5a9ef8" stroke-width="1.5" stroke-opacity="0.4"/>
      <path d="M6 14L42 14" stroke="#5a9ef8" stroke-width="1.5" stroke-opacity="0.4"/>
      <path d="M6 14L24 24L42 14" stroke="#5a9ef8" stroke-width="2" stroke-linejoin="round"/>
      <path d="M24 24V44" stroke="#5a9ef8" stroke-width="2"/>
      <circle cx="24" cy="24" r="3" fill="#5a9ef8" fill-opacity="0.7"/>
    </svg>
  </div>

  <div class="login-title">
    <h1>신성오토텍 <span>금형 INDEX</span></h1>
  </div>
  <div class="login-subtitle">SUNGSEOUNG AUTOTECH · MOLD MANAGEMENT</div>

  <div class="input-wrap">
    <input
      type="password"
      id="pwdInput"
      placeholder="비밀번호를 입력하세요"
      maxlength="20"
      autocomplete="current-password"
      onkeydown="if(event.key==='Enter') doLogin()"
    >
    <button class="eye-btn" onclick="toggleEye()" id="eyeBtn" type="button" title="비밀번호 표시/숨김">
      <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  <button class="login-btn" id="loginBtn" onclick="doLogin()">입장하기</button>
  <div class="err-msg" id="errMsg"></div>

  <div class="login-footer">신성오토텍 금형관리시스템 · 내부 전용</div>
</div>

<script>
async function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errMsg');

  if (!pwd) {
    err.textContent = '비밀번호를 입력하세요';
    err.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>확인 중...';
  err.classList.remove('show');

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });

    if (res.ok) {
      btn.innerHTML = '✓ 입장';
      window.location.replace('/');
    } else {
      const d = await res.json().catch(() => ({}));
      err.textContent = d.error || '비밀번호가 틀렸습니다';
      err.classList.add('show');
      document.getElementById('pwdInput').value = '';
      document.getElementById('pwdInput').focus();
      btn.disabled = false;
      btn.textContent = '입장하기';
    }
  } catch(e) {
    err.textContent = '서버 연결 오류';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = '입장하기';
  }
}

function toggleEye() {
  const inp = document.getElementById('pwdInput');
  const icon = document.getElementById('eyeIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.innerHTML = `
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    `;
  } else {
    inp.type = 'password';
    icon.innerHTML = `
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    `;
  }
}

window.addEventListener('load', () => {
  document.getElementById('pwdInput').focus();
});
</script>
</body>
</html>
